<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6ec6ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Mini Leo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: #6ec6ff;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }

    /* Stelle raccolte (in alto) */
    #hud {
      position: fixed; top: max(12px, env(safe-area-inset-top)); left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 6px; padding: 8px 14px;
      background: rgba(255,255,255,0.55); border-radius: 40px;
      pointer-events: none;
      box-shadow: 0 4px 0 rgba(0,0,0,0.08);
    }
    #hud svg { width: 40px; height: 40px; transition: transform .2s; }
    #hud svg path { fill-rule: evenodd; fill: rgba(255,255,255,0.9); stroke: #c9b9e6; stroke-width: 3; stroke-linejoin: round; transition: fill .2s; }
    #hud svg.on path { fill: var(--on-fill, #ffd23f); stroke: var(--on-stroke, #f0a500); }
    #hud.night { background: rgba(255,255,255,0.22); }
    #hud.night svg path { fill: rgba(255,255,255,0.25); stroke: #8f9bd6; }
    #hud.night svg.on path { fill: var(--on-fill); stroke: var(--on-stroke); }
    #hud svg.on { animation: pop .5s cubic-bezier(.3,1.8,.5,1); }
    #hud.party svg { animation: dance .5s ease-in-out infinite alternate; }
    #hud.party svg:nth-child(2n) { animation-delay: .25s; }
    @keyframes pop { 0% { transform: scale(.2); } 100% { transform: scale(1); } }
    @keyframes dance { from { transform: translateY(0) rotate(-12deg) scale(1.1); } to { transform: translateY(-6px) rotate(12deg) scale(1.2); } }

    /* Musica on/off: serve una pressione lunga (così il bimbo non la spegne per sbaglio) */
    #music {
      position: fixed; top: max(14px, env(safe-area-inset-top)); left: 12px;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,0.45); color: #6a5acd;
      font: bold 22px/40px sans-serif; text-align: center;
      opacity: .55; transition: opacity .2s, transform .2s; z-index: 5;
    }
    #music.off { text-decoration: line-through; opacity: .35; }
    #music.press { transform: scale(1.25); opacity: .9; }

    /* Casetta: tenendola premuta 2 secondi si torna al menù (il cerchio giallo si riempie) */
    #home {
      --p: 0;
      position: fixed; top: max(10px, env(safe-area-inset-top)); right: 10px;
      width: 52px; height: 52px; border-radius: 50%;
      background: conic-gradient(#ffd23f calc(var(--p) * 360deg), rgba(255,255,255,0.5) 0);
      display: none; align-items: center; justify-content: center;
      transition: transform .2s; z-index: 5;
    }
    #home.show { display: flex; }
    #home.press { transform: scale(1.2); }
    #home svg { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.85); padding: 3px; box-sizing: border-box; }

    /* Passaggio da un mondo all'altro */
    #wipe { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity .6s ease; }
    #wipe.on { opacity: 1; }

    /* Menù iniziale: tre bottoni grandi, uno per minigioco */
    #menu {
      position: fixed; inset: 0; z-index: 4;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh;
      background: radial-gradient(circle at 50% 40%, rgba(255,255,255,0.55), rgba(140,200,255,0.55));
      transition: opacity .45s;
    }
    #menu.hide { opacity: 0; pointer-events: none; }
    #menu h1 {
      margin: 0; font: 900 clamp(28px, 7vmin, 56px) / 1 "Trebuchet MS", system-ui, sans-serif;
      color: #fff; letter-spacing: 1px;
      text-shadow: 0 3px 0 #f5892b, 0 6px 12px rgba(0,0,0,0.18);
    }
    .games { display: grid; grid-template-columns: repeat(2, auto); gap: 4vmin; justify-items: center; }
    .game {
      --s: min(30vh, 40vw);
      width: var(--s); height: var(--s); border-radius: 50%;
      border: calc(var(--s) * 0.045) solid #fff; box-sizing: border-box;
      box-shadow: 0 calc(var(--s) * 0.05) 0 rgba(0,0,0,0.12), 0 10px 30px rgba(0,0,0,0.15);
      overflow: hidden; animation: breathe 1.6s ease-in-out infinite alternate;
    }
    .game:nth-child(2) { animation-delay: .5s; }
    .game:nth-child(3) { animation-delay: 1s; }
    .game:nth-child(4) { animation-delay: 1.5s; }
    .game svg { width: 100%; height: 100%; display: block; }
    .game.soon { filter: saturate(.85); }
    .game.nope { animation: nope .5s ease; }
    .game.go { animation: go .35s ease forwards; }
    @media (orientation: landscape) {
      .games { grid-template-columns: repeat(4, auto); gap: 3vw; }
      .game { --s: min(20vw, 52vh); }
    }
    @keyframes breathe { from { transform: scale(1); } to { transform: scale(1.06); } }
    @keyframes nope { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-10deg); } 40% { transform: rotate(9deg); } 60% { transform: rotate(-6deg); } 80% { transform: rotate(4deg); } }
    @keyframes go { to { transform: scale(1.25); opacity: .6; } }
  </style>
</head>
